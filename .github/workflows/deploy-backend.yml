name: Deploy Backend

# main → ghcr.io/…/nkust-auto-rollcall-api:main（production）
# develop → ghcr.io/…/nkust-auto-rollcall-api:dev（測試環境）
# VM 上的 Watchtower 會自動拉新 image 重啟對應容器
on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/chun-wei2006/nkust-auto-rollcall-api

jobs:
  build-and-push:
    name: Build & push image (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then echo "env=main" >> "$GITHUB_OUTPUT"; else echo "env=dev" >> "$GITHUB_OUTPUT"; fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.env }}
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

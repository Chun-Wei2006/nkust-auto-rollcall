services:
  api:
    build: .
    restart: unless-stopped
    environment:
      - PORT=8000
      - FRONTEND_URL=${FRONTEND_URL:-https://autorollcall.chunweidev.com}

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - api
